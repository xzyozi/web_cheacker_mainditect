[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-cheacker-mainditect"
version = "0.1.0"
description = "A web checker and content extraction tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Your Name", email = "you@example.com" },
]

# Main application dependencies
dependencies = [
  "pandas",
  "PyYAML",
  "playwright",
  "Pillow",
  "aiohttp",
  "jinja2",
  "scipy",
  "numpy<2",
  "requests",
]

[tool.hatch.build.targets.wheel]
# Flat-layout scripts (no package named after the project): skip file selection
bypass-selection = true
[project.urls]
Homepage = "https://github.com/user/repo" # Change to your repo URL

[project.optional-dependencies]
# Development and testing tools
dev = [
  "pip-tools",
  "pytest",
  "pytest-mock",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
]

# Mutation testing (Linux / WSL2 / CI only): uv sync --extra dev --extra mutation
mutation = [
  "mutmut>=3.0.0",
]

[tool.hatch.scripts]
# Defines custom scripts runnable with `hatch run <script_name>`
all = ["setup", "test", "create-shortcut"]

# Setup script: Compiles requirements, syncs environment, and installs browsers
setup = [
  "pip-compile requirements.in -o requirements.txt",
  "pip-sync requirements.txt",
  "playwright install",
  "python create_shortcut.py"
]

# Sync environment with requirements.txt
sync = "pip-sync requirements.txt"

# Run tests using pytest
test = "pytest"

# Create the .bat shortcut for running the application
create-shortcut = "python create_shortcut.py"

# ==========================================
# Linter & Formatter (Ruff)
# ==========================================
[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "mutants",
    "review",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, W: pycodestyle warnings, I: isort
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

# ==========================================
# Testing (Pytest)
# ==========================================
[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
# CI では PYTHONPATH を設定しないため、プロジェクトルートを import パスに加える
pythonpath = ["."]
