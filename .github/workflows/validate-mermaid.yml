name: Validate Mermaid diagrams

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**/*.md"
      - "README.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**/*.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mermaid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Restore Mermaid CLI cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-mermaid-cli-11.4.2

      - name: Install Chrome for Mermaid CLI
        shell: bash
        run: |
          npx --yes puppeteer@23.11.1 browsers install chrome-headless-shell@131.0.6778.204
          npx --yes puppeteer@23.11.1 browsers install chrome@131.0.6778.204
      - name: Validate changed Mermaid diagrams
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node .github/scripts/validateMermaidMarkdown.mjs --all
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          node .github/scripts/validateMermaidMarkdown.mjs \
            --base "$base_sha" \
            --head "$GITHUB_SHA"
